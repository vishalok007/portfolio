    const origError = console.error;

      origError.apply(console, args);

    // Custom JS Crossfade Video Component (rAF-driven)
    function FadingVideo({ src, className, style }) {
      const videoRef = useRef(null);
      const rafIdRef = useRef(null);
      const fadingOutRef = useRef(false);

      const FADE_MS = 500;
      const FADE_OUT_LEAD = 0.55;

      const fadeTo = (targetOpacity, durationMs = FADE_MS) => {
        if (rafIdRef.current !== null) {
          cancelAnimationFrame(rafIdRef.current);
          rafIdRef.current = null;
        }

        const video = videoRef.current;
        if (!video) return;

        const startOpacity = parseFloat(video.style.opacity || "0");
        const opacityDiff = targetOpacity - startOpacity;
        if (Math.abs(opacityDiff) < 0.01) {
          video.style.opacity = targetOpacity.toString();
          return;
        }

        const startTime = performance.now();

        const step = (now) => {
          const elapsed = now - startTime;
          const progress = Math.min(1, elapsed / durationMs);
          const currentOpacity = startOpacity + opacityDiff * progress;

          if (videoRef.current) {
            videoRef.current.style.opacity = currentOpacity.toFixed(4);
          }

          if (progress < 1) {
            rafIdRef.current = requestAnimationFrame(step);
          } else {
            if (videoRef.current) {
              videoRef.current.style.opacity = targetOpacity.toString();
            }
            rafIdRef.current = null;
          }
        };

        rafIdRef.current = requestAnimationFrame(step);
      };

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        video.style.opacity = "0";

        const handleLoadedData = () => {
          video.style.opacity = "0";
          video.play().catch(() => {});
          fadeTo(1, FADE_MS);
        };

        const handleTimeUpdate = () => {
          if (!video.duration || isNaN(video.duration)) return;
          const timeLeft = video.duration - video.currentTime;
          if (!fadingOutRef.current && timeLeft <= FADE_OUT_LEAD && timeLeft > 0) {
            fadingOutRef.current = true;
            fadeTo(0, FADE_MS);
          }
        };

        const handleEnded = () => {
          video.style.opacity = "0";
          setTimeout(() => {
            if (videoRef.current) {
              videoRef.current.currentTime = 0;
              videoRef.current.play().catch(() => {});
              fadingOutRef.current = false;
              fadeTo(1, FADE_MS);
            }
          }, 100);
        };

        video.addEventListener("loadeddata", handleLoadedData);
        video.addEventListener("timeupdate", handleTimeUpdate);
        video.addEventListener("ended", handleEnded);

        if (video.readyState >= 2) {
          handleLoadedData();
        }

        return () => {
          if (rafIdRef.current !== null) {
            cancelAnimationFrame(rafIdRef.current);
          }
          video.removeEventListener("loadeddata", handleLoadedData);
          video.removeEventListener("timeupdate", handleTimeUpdate);
          video.removeEventListener("ended", handleEnded);
        };
      }, [src]);

      return (
        <video
          ref={videoRef}
          src={src}
          autoPlay
          muted
          playsInline
          preload="auto"
          className={className}
          style={{ opacity: 0, ...style }}
        />
      );
    }

    // Word-by-word BlurText Animation Component
    function BlurText({ text, className }) {
      const [isVisible, setIsVisible] = useState(false);
      const containerRef = useRef(null);

      useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setIsVisible(true);
            }
          },
          { threshold: 0.1 }
        );

        if (containerRef.current) {
          observer.observe(containerRef.current);
        }

        return () => observer.disconnect();
      }, []);

      const words = text.split(" ");

      return (
        <p
          ref={containerRef}
          className={className}
          style={{
            display: "flex",
            flexWrap: "wrap",
            justifyContent: "center",
            rowGap: "0.1em"
          }}
        >
          {words.map((word, i) => (
            <motion.span
              key={i}
              initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
              animate={
                isVisible
                  ? {
                      filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                      opacity: [0, 0.5, 1],
                      y: [50, -5, 0]
                    }
                  : {}
              }
              transition={{
                duration: 0.7,
                times: [0, 0.5, 1],
                ease: "easeOut",
                delay: (i * 100) / 1000
              }}
              style={{
                display: "inline-block",
                marginRight: "0.28em"
              }}
            >
              {word}
            </motion.span>
          ))}
        </p>
      );
    }
